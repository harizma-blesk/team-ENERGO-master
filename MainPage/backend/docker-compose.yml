version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: teamenergo_postgres
    environment:
      POSTGRES_DB: teamenergo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./laravel_server_schema.sql:/docker-entrypoint-initdb.d/seed_database.sql
    restart: unless-stopped

volumes:
  postgres_data:
